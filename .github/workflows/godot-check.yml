name: Godot validation

on:
  push:
    paths:
      - "Godot/**"
      - ".github/workflows/godot-check.yml"
  pull_request:
    paths:
      - "Godot/**"
      - ".github/workflows/godot-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Godot project and import assets
        working-directory: Godot
        run: godot --headless --editor --path . --quit

      - name: Run project headless smoke start
        working-directory: Godot
        run: timeout 20s godot --headless --path . --quit-after 3
