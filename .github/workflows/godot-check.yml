name: Godot validation and Android APK

on:
  push:
    paths:
      - "Godot/**"
      - ".github/workflows/godot-check.yml"
  pull_request:
    paths:
      - "Godot/**"
      - ".github/workflows/godot-check.yml"
  workflow_dispatch:

concurrency:
  group: euro-haul-godot-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import and validate project
        working-directory: Godot
        run: godot --headless --editor --path . --quit

      - name: Headless runtime smoke test
        working-directory: Godot
        run: godot --headless --path . --quit-after 5

      - name: Export Android debug APK
        working-directory: Godot
        run: |
          mkdir -p ../build/Android
          godot --headless --path . --export-debug Android ../build/Android/EURO-HAUL-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EURO-HAUL-Android-debug
          path: build/Android/EURO-HAUL-debug.apk
          if-no-files-found: error
          retention-days: 14
