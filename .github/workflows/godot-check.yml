name: Godot validation and Android APK

on:
  push:
    paths:
      - "Godot/**"
      - ".github/workflows/godot-check.yml"
  pull_request:
    paths:
      - "Godot/**"
      - ".github/workflows/godot-check.yml"
  workflow_dispatch:

concurrency:
  group: euro-haul-godot-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Ensure matching Godot 4.4.1 export templates
        shell: bash
        run: |
          set -euo pipefail
          version="4.4.1"
          destination="$HOME/.local/share/godot/export_templates/${version}.stable"
          command -v wget >/dev/null
          command -v unzip >/dev/null
          if [ ! -s "$destination/android_debug.apk" ] || [ ! -s "$destination/android_release.apk" ] || [ ! -s "$destination/windows_debug_x86_64.exe" ] || [ ! -s "$destination/windows_release_x86_64.exe" ]; then
            archive="/tmp/Godot_v${version}-stable_export_templates.tpz"
            mkdir -p "$destination" /tmp/godot-export-templates
            wget -q --tries=3 -O "$archive" "https://github.com/godotengine/godot-builds/releases/download/${version}-stable/Godot_v${version}-stable_export_templates.tpz"
            unzip -q "$archive" -d /tmp/godot-export-templates
            cp -R /tmp/godot-export-templates/templates/. "$destination/"
          fi
          test -s "$destination/android_debug.apk"
          test -s "$destination/android_release.apk"
          test -s "$destination/windows_debug_x86_64.exe"
          test -s "$destination/windows_release_x86_64.exe"

      - name: Create temporary CI debug keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore /tmp/euro-haul-debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=EURO HAUL,C=PK"
          sed -i '/^\[preset\.1\]/i\
keystore/debug="/tmp/euro-haul-debug.keystore"\
keystore/debug_user="androiddebugkey"\
keystore/debug_password="android"' Godot/export_presets.cfg

      - name: Import and validate project scripts
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          godot --headless --editor --path Godot --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-import.log; then
            echo "Godot script import reported errors."
            exit 1
          fi

      - name: Headless runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path Godot --quit-after 5 2>&1 | tee /tmp/godot-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-runtime.log; then
            echo "Godot runtime reported script errors."
            exit 1
          fi
          grep -q "EURO HAUL Godot vertical-slice booted" /tmp/godot-runtime.log

      - name: Run career, company and vehicle logic tests
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path Godot --script res://Tests/logic_smoke_test.gd 2>&1 | tee /tmp/godot-logic.log
          grep -q "EURO HAUL logic smoke tests passed" /tmp/godot-logic.log

      - name: Export Android ARM64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          mkdir -p build/Android
          godot --headless --path Godot --export-debug Android build/Android/EURO-HAUL-debug.apk 2>&1 | tee /tmp/godot-export.log
          test -s build/Android/EURO-HAUL-debug.apk
          unzip -t build/Android/EURO-HAUL-debug.apk
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging build/Android/EURO-HAUL-debug.apk > /tmp/euro-haul-badging.txt
          head -n 8 /tmp/euro-haul-badging.txt
          sha256sum build/Android/EURO-HAUL-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EURO-HAUL-Android-debug
          path: build/Android/EURO-HAUL-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Export Windows x64 debug build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/Windows
          godot --headless --path Godot --export-debug "Windows Desktop" build/Windows/EURO-HAUL.exe 2>&1 | tee /tmp/godot-windows-export.log
          test -s build/Windows/EURO-HAUL.exe
          test "$(dd if=build/Windows/EURO-HAUL.exe bs=1 count=2 2>/dev/null)" = "MZ"
          sha256sum build/Windows/EURO-HAUL.exe

      - name: Upload Windows desktop build
        uses: actions/upload-artifact@v4
        with:
          name: EURO-HAUL-Windows-x64-debug
          path: build/Windows/EURO-HAUL.exe
          if-no-files-found: error
          retention-days: 14
