name: Request Unity license activation file

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation:
    name: Generate Unity activation request
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: activation
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.0f1

      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: euro-haul-unity-activation-request
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
