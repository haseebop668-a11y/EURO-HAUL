name: Unity validation and builds

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: euro-haul-unity-ci
  cancel-in-progress: false

jobs:
  editmode-tests:
    name: Unity EditMode tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run Unity tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Game
          unityVersion: 6000.3.0f1
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: euro-haul-unity-test-results
          path: artifacts
          if-no-files-found: warn

  builds:
    name: Build ${{ matrix.targetPlatform }}
    needs: editmode-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - Android
          - StandaloneWindows64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space for Android
        if: matrix.targetPlatform == 'Android'
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Build player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Game
          unityVersion: 6000.3.0f1
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: EURO-HAUL
          buildMethod: EuroHaul.Editor.EuroHaulBuild.Build
          buildsPath: build
          androidExportType: androidPackage
          allowDirtyBuild: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EURO-HAUL-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          if-no-files-found: error
